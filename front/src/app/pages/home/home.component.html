<div class="home-container">
  <h1>📂 Gestion de Documents</h1>
  <p class="subtitle">
    Centralisez, organisez et accédez facilement à vos documents.
  </p>

  <div class="cards">
    <mat-card class="feature-card">
      <mat-icon class="icon" color="primary">upload_file</mat-icon>
      <h2>Créer un document</h2>
      <p>Ajoutez un nouveau document et téléchargez vos fichiers associés.</p>
      <button mat-raised-button color="primary" routerLink="/new">
        Nouveau document
      </button>
    </mat-card>

    <mat-card class="feature-card">
      <mat-icon class="icon" color="accent">folder</mat-icon>
      <h2>Consulter vos documents</h2>
      <p>Accédez à la liste des documents existants et visualisez leurs fichiers.</p>
      <button mat-raised-button color="accent" routerLink="/list">
        Voir la liste
      </button>
    </mat-card>
  </div>
</div>
